name: Deploy to Nest

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.js'
      - 'config.js'
      - 'listeners/**'
      - 'agent/**'
      - 'thread-context/**'
      - 'manifest.json'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tests/**'
      - '.github/workflows/deploy-nest.yml'

# The default token only needs to read the repo. Nothing here pushes or writes.
permissions:
  contents: read

concurrency:
  group: deploy-to-nest
  cancel-in-progress: false

jobs:
  # A deploy may only happen if the code is actually green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # This gate MUST live at step level, not as a job-level `if`.
      # GitHub does not expose the `secrets` context to `jobs.<id>.if`. A
      # workflow referencing it there is not merely rejected at runtime - it
      # fails to parse at all, spawns zero jobs, and reports "likely failed
      # because of a workflow file issue" with no logs and no jobs to inspect.
      # `secrets` IS available in `steps.*.env`, so read it there and branch on
      # a step output instead.
      - name: Require Nest deployment credentials
        env:
          NEST_HOST: ${{ secrets.NEST_HOST }}
          NEST_USER: ${{ secrets.NEST_USER }}
          NEST_PATH: ${{ secrets.NEST_PATH }}
          NEST_SSH_KEY: ${{ secrets.NEST_SSH_KEY }}
        run: |
          missing=0
          for key in NEST_HOST NEST_USER NEST_PATH NEST_SSH_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Nest not configured::${key} must be configured as a repository Actions secret."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Jarvis was NOT deployed. See docs/NEST-DEPLOY.md."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a secret can never become shell syntax.
          NEST_PATH: ${{ secrets.NEST_PATH }}
        with:
          host: ${{ secrets.NEST_HOST }}
          username: ${{ secrets.NEST_USER }}
          key: ${{ secrets.NEST_SSH_KEY }}
          envs: NEST_PATH
          # Fail on errors so preflight, pull, install or restart errors
          # fails the job instead of reporting a green deploy that never happened.
          script: |
            set -eu

            if [ -z "${NEST_PATH:-}" ] || [ ! -d "$NEST_PATH" ]; then
              echo "NEST_PATH is unset or is not a directory on the server."
              exit 1
            fi
            cd "$NEST_PATH"

            # Secrets live only on the server, never in git. Fail loudly here
            # rather than letting the unit crash-loop on a missing token.
            if [ ! -f .env ]; then
              echo "No .env in $NEST_PATH. See docs/NEST-DEPLOY.md."
              exit 1
            fi
            # AI is optional; basic commands and the text fallback work without it.
            for key in SLACK_BOT_TOKEN SLACK_APP_TOKEN; do
              if ! grep -qE "^${key}=.+" .env; then
                echo ".env is missing a non-empty $key"
                exit 1
              fi
            done

            git pull --ff-only origin master

            npm ci --omit=dev
            # Fail before restart when either Slack token is invalid or Socket Mode cannot connect.
            npm run doctor
            if grep -qE '^HACKCLUB_AI_API_KEY=.+' .env; then
              # Test the installed Hack Club AI key without revealing its value.
              npm run doctor:ai
            else
              echo '::warning::HACKCLUB_AI_API_KEY is not configured on Nest; AI chat will be disabled.'
            fi

            # Nest may give an ordinary username rather than root.
            # Select the matching unit manager; missing services fail clearly.
            if [ "$(id -u)" -eq 0 ]; then
              unit() { systemctl "$@"; }
            else
              unit() { systemctl --user "$@"; }
            fi
            if ! unit cat slackbot.service >/dev/null 2>&1; then
              echo "No slackbot.service in this account's systemd manager."
              echo "Install the service first using docs/NEST-DEPLOY.md."
              exit 1
            fi
            unit restart slackbot.service

            # Verify after a restart, then leave troubleshooting in the job log.
            for attempt in 1 2 3 4 5; do
              if unit is-active --quiet slackbot.service; then
                echo "slackbot.service is active (attempt $attempt)"
                exit 0
              fi
              echo "not active yet (attempt $attempt); status follows"
              unit status slackbot.service --no-pager --lines=20 || true
              sleep 3
            done

            echo "slackbot.service did not stay active after restart."
            exit 1
