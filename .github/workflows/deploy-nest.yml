name: Deploy to Nest

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.js'
      - 'listeners/**'
      - 'agent/**'
      - 'thread-context/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.NEST_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NEST_HOST }}
          username: ${{ secrets.NEST_USER }}
          key: ${{ secrets.NEST_SSH_KEY }}
          script: |
            cd ${{ secrets.NEST_PATH }}
            git pull --ff-only origin main || git pull --ff-only origin master
            npm install --omit=dev
            systemctl --user restart slackbot.service 2>/dev/null || systemctl restart slackbot.service 2>/dev/null || true

      - name: Report deployment status
        run: echo "Deploy triggered for ${{ github.repository }}"
